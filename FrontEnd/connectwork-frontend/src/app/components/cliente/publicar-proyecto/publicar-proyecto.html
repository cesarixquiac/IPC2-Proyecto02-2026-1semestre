<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">ConnectWork</span>
    <button class="btn btn-outline-light" routerLink="/cliente/dashboard">Volver al Dashboard</button>
  </div>
</nav>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">Publicar Nuevo Proyecto</h4>
        </div>
        <div class="card-body">
          
          <div *ngIf="mensajeExito" class="alert alert-success fw-bold text-center">{{ mensajeExito }}</div>
          <div *ngIf="mensajeError" class="alert alert-danger fw-bold text-center">{{ mensajeError }}</div>

          <form (ngSubmit)="publicar()">
            
            <div class="mb-3">
              <label class="form-label fw-bold">Título del Proyecto *</label>
              <input type="text" class="form-control" name="titulo" [(ngModel)]="nuevoProyecto.titulo" placeholder="Ej: E-commerce para venta mayorista" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Descripción *</label>
              <textarea class="form-control" name="descripcion" rows="4" [(ngModel)]="nuevoProyecto.descripcion" placeholder="Detalla lo que necesitas..." required></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Categoría *</label>
                <select class="form-select" name="idCategoria" [(ngModel)]="nuevoProyecto.idCategoria" required>
                  <option [ngValue]="null" disabled selected>Selecciona una categoría...</option>
                  <option *ngFor="let cat of categorias" [ngValue]="cat.id">{{ cat.nombre }}</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Presupuesto Máximo (Q) *</label>
                <input type="number" class="form-control" name="presupuestoMaximo" [(ngModel)]="nuevoProyecto.presupuestoMaximo" placeholder="Ej: 1200" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label fw-bold">Fecha Límite *</label>
                <input type="date" class="form-control" name="fechaLimite" [(ngModel)]="nuevoProyecto.fechaLimite" required>
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-bold">Habilidades Requeridas *</label>
                <select multiple class="form-select" name="habilidadesRequeridas" [(ngModel)]="nuevoProyecto.habilidadesRequeridas" required style="height: 100px;">
                  <option *ngFor="let hab of habilidades" [ngValue]="hab.id">{{ hab.nombre }}</option>
                </select>
                <div class="form-text" style="font-size: 0.85em;">Mantén presionada la tecla Ctrl (o Cmd en Mac) para seleccionar varias habilidades.</div>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold fs-5">¡Publicar Proyecto!</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
