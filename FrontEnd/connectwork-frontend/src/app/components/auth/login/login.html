<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">ConnectWork</h2>
      <p class="text-muted">Inicia sesión en tu cuenta</p>
    </div>

    <!-- Alerta de error -->
    <div *ngIf="mensajeError" class="alert alert-danger text-center">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-3">
        <label for="username" class="form-label">Nombre de Usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          [(ngModel)]="credenciales.username" 
          required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          [(ngModel)]="credenciales.password" 
          required>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
    </form>

    <div class="text-center mt-3">
  <span class="text-muted">¿No tienes cuenta?</span>
  <a routerLink="/registro" class="text-primary fw-bold text-decoration-none ms-1">Regístrate</a>
</div>
  </div>
</div>
