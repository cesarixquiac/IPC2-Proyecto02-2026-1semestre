<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">🚀 Completa tu Perfil Profesional</h4>
                    <p class="mb-0 small">Necesitamos estos datos para que puedas aplicar a proyectos.</p>
                </div>
                <div class="card-body p-4">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Biografía Profesional</label>
                        <textarea class="form-control" rows="4" [(ngModel)]="perfil.biografia" 
                            placeholder="Ej: Desarrollador backend especialista en Java con 5 años de experiencia..."></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nivel de Experiencia</label>
                            <select class="form-select" [(ngModel)]="perfil.nivelExperiencia">
                                <option value="" disabled selected>Selecciona tu nivel...</option>
                                <option value="JUNIOR">Junior (1-2 años)</option>
                                <option value="SEMI_SENIOR">Semi-Senior (3-5 años)</option>
                                <option value="SENIOR">Senior (+5 años)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tarifa por Hora (Q.)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light fw-bold">Q.</span>
                                <input type="number" class="form-control" [(ngModel)]="perfil.tarifaHora" placeholder="Ej: 25.50">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Tus Habilidades (Selecciona al menos una)</label>
                        <div class="border rounded p-3 bg-light">
                            <div class="row">
                                <!-- ¡CORREGIDO! Ahora usa hab.id en lugar de hab.id_habilidad -->
                                @for (hab of listaHabilidades; track hab.id) {
                                    <div class="col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" [id]="'hab_'+hab.id"
                                                (change)="toggleHabilidad(hab.id, $event)">
                                            <label class="form-check-label" [for]="'hab_'+hab.id">
                                                {{ hab.nombre }}
                                            </label>
                                        </div>
                                    </div>
                                }
                            </div>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-success btn-lg fw-bold" (click)="guardarPerfil()">
                            💾 Guardar y Empezar a Trabajar
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
