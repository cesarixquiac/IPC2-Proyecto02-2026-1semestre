<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">ConnectWork - Freelancer</a>
    <div class="d-flex">
      <button class="btn btn-outline-light" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <h2 class="mb-4 fw-bold">Proyectos Disponibles</h2>

  <div *ngIf="mensajeError" class="alert alert-danger fw-bold">{{ mensajeError }}</div>

  <!-- Mensaje por si la base de datos está vacía -->
  <div *ngIf="proyectosDisponibles.length === 0 && !mensajeError" class="alert alert-info text-center fw-bold">
    Aún no hay proyectos publicados. ¡Vuelve más tarde!
  </div>

  <!-- Cuadrícula de Tarjetas con los proyectos -->
  <div class="row">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let proyecto of proyectosDisponibles">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold text-primary">{{ proyecto.titulo }}</h5>
          <p class="card-text text-muted mb-3" style="font-size: 0.9em;">
            <!-- Usamos el pipe slice para que descripciones largas no rompan el diseño -->
            {{ proyecto.descripcion | slice:0:120 }}... 
          </p>
          
          <ul class="list-unstyled mb-4 mt-auto">
            <li><strong>💰 Presupuesto:</strong> Q. {{ proyecto.presupuestoMaximo }}</li>
            <li><strong>📅 Límite:</strong> {{ proyecto.fechaLimite }}</li>
          </ul>
          
          <button class="btn btn-success w-100 fw-bold mt-auto">Enviar Propuesta</button>
        </div>
      </div>
    </div>
  </div>
</div>
