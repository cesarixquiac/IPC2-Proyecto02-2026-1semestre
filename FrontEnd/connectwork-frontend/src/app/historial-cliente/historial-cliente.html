<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">💳 Historial de Recargas</h2>
        <button class="btn btn-outline-primary" routerLink="/cliente/dashboard">Volver al Dashboard</button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
           @if (!historial || historial.length === 0) {
                <div class="alert alert-info text-center fw-bold mb-0">No has realizado ninguna recarga de saldo aún.</div>
            } @else {
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Fecha de Recarga</th>
                                <th>Monto Depositado</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (recarga of historial; track $index) {
                            <tr>
                                <td>{{ $index + 1 }}</td>
                                <td>{{ recarga.fecha }}</td>
                                <td class="text-success fw-bold">+ Q. {{ recarga.monto | number:'1.2-2' }}</td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            }
        </div>
    </div>
</div>
